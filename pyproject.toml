[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ipv8-lab"
version = "0.1.0"
description = "Experimental userspace IPv8 toolkit for address parsing, packet building, routing simulation, and local testbeds."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
  {name = "Aleksei Aleinikov", email = "contact@alekseialeinikov.com"}
]
keywords = [
  "ipv8",
  "networking",
  "internet-protocol",
  "userspace-networking",
  "packet-parser",
  "routing-simulator",
  "protocol-research"
]
dependencies = [
  "typer>=0.12.0",
  "pyyaml>=6.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[project.scripts]
ipv8lab = "ipv8lab.cli.main:app"

[project.urls]
Homepage = "https://github.com/LF3551/Open-IPv8-Lab"
Repository = "https://github.com/LF3551/Open-IPv8-Lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
